[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-signal-memo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
]

[tool.tox]
envlist = ["uv"]

[tool.tox.testenv.uv]
deps = ["pytest", "numpy"]
commands = ["pytest -q"]

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pylint>=3.3.8",
    "pytest-cov>=6.2.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pylint.main]
py-version = "3.12"

[tool.pylint.format]
max-line-length = 130

[tool.pylint.messages_control]
disable = [
    "invalid-name",
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
]
